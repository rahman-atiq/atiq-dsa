<!-- The browser UI colour, one per scheme so the automatic case needs no
     script. shared/chrome.js flips the `media` attributes when the reader
     picks light or dark outright. Values are --surface from tokens.css. -->
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" data-scheme="light">
<meta name="theme-color" content="#0B1020" media="(prefers-color-scheme: dark)" data-scheme="dark">

<link rel="stylesheet" href="shared/chrome.css">
<script src="shared/catalog.js" defer></script>
<script src="shared/chrome.js" defer></script>
<script>
/* Applied before first paint so a dark-theme reload never flashes white.
   Inline on purpose: a shared file would be one blocking round trip in
   front of every page's first render, to save three lines. */
(function(){try{var t=localStorage.getItem('dsa.theme');
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
/* ============================================================
   The Python hub. Same deep-space ground as the front door --
   two hubs that look like two different apps would be worse
   than one long list -- with the accent moved onto the
   language's own blue and gold.

   A hub is still a page, so this file owns its own markup and
   styles the way every other page does. The duplication with
   index.html is the price of that rule and is deliberate:
   these are readable-on-their-own artefacts, and only the
   chrome and the tokens are shared.
   ============================================================ */
/* Every selector carries [data-topic="python"] for the same reason the
   front door carries [data-topic="hub"]: the dark block in
   shared/tokens.css is :root:not([data-theme="light"]), which outranks a
   bare :root however late it loads. Matching its specificity is what lets
   a hub keep its own ground.

   Dark is the base here, not light. */
:root[data-topic="python"]{
  color-scheme:dark;
  --bg:#04060f;
  --bg-deep:#010206;
  --surface:#0B1020;
  --surface-2:#111731;
  --fg:#EEF2FF;
  --fg-dim:#9AA6C8;
  --fg-faint:#5F6A8D;
  --line:rgba(140,170,255,.13);
  --line-strong:rgba(140,170,255,.30);

  --glass:rgba(255,255,255,.032);
  --glass-hover:rgba(255,255,255,.062);
  --sky-1:rgba(55,118,171,.34);
  --sky-2:rgba(255,212,59,.10);
  --sky-3:rgba(75,139,190,.14);
  --grid-ink:rgba(140,170,255,.075);
  --orb-1:rgba(75,139,190,.85);
  --orb-2:rgba(255,212,59,.42);
  --orb-3:rgba(110,160,255,.50);
  --orb-opacity:.5;

  /* card colour: bright and saturated against a near-black ground */
  --card-l:68%;
  --card-s:88%;
}

/* Daylight. Same layout, same hues, inverted ground: the orbs become a
   pale wash instead of glowing, because a glow on white is just a smudge. */
@media (prefers-color-scheme:light){:root[data-topic="python"]:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#F1F4FC;
  --bg-deep:#E4EAF8;
  --surface:#FFFFFF;
  --surface-2:#F7F9FE;
  --fg:#161A2C;
  --fg-dim:#4B5473;
  --fg-faint:#7B85A5;
  --line:rgba(38,56,120,.14);
  --line-strong:rgba(38,56,120,.30);

  --glass:rgba(255,255,255,.62);
  --glass-hover:rgba(255,255,255,.88);
  --sky-1:rgba(55,118,171,.16);
  --sky-2:rgba(255,196,40,.13);
  --sky-3:rgba(75,139,190,.12);
  --grid-ink:rgba(60,80,160,.07);
  --orb-1:rgba(55,118,171,.30);
  --orb-2:rgba(240,190,40,.26);
  --orb-3:rgba(110,160,255,.22);
  --orb-opacity:.42;

  --card-l:38%;
  --card-s:62%;
}}
:root[data-topic="python"][data-theme="light"]{
  color-scheme:light;
  --bg:#F1F4FC;
  --bg-deep:#E4EAF8;
  --surface:#FFFFFF;
  --surface-2:#F7F9FE;
  --fg:#161A2C;
  --fg-dim:#4B5473;
  --fg-faint:#7B85A5;
  --line:rgba(38,56,120,.14);
  --line-strong:rgba(38,56,120,.30);

  --glass:rgba(255,255,255,.62);
  --glass-hover:rgba(255,255,255,.88);
  --sky-1:rgba(55,118,171,.16);
  --sky-2:rgba(255,196,40,.13);
  --sky-3:rgba(75,139,190,.12);
  --grid-ink:rgba(60,80,160,.07);
  --orb-1:rgba(55,118,171,.30);
  --orb-2:rgba(240,190,40,.26);
  --orb-3:rgba(110,160,255,.22);
  --orb-opacity:.42;

  --card-l:38%;
  --card-s:62%;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh;
  background:var(--bg); color:var(--fg);
  font-family:var(--sans);
  line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---------- animated backdrop ---------- */
.sky{
  position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(ellipse 1200px 700px at 50% -20%, var(--sky-1), transparent 70%),
    radial-gradient(ellipse 900px 600px at 100% 10%, var(--sky-2), transparent 65%),
    radial-gradient(ellipse 800px 700px at 0% 45%, var(--sky-3), transparent 65%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
}
.sky::after{
  content:''; position:absolute; inset:0;
  background-image:
    linear-gradient(to right, var(--grid-ink) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-ink) 1px, transparent 1px);
  background-size:62px 62px;
  -webkit-mask-image:radial-gradient(ellipse 100% 70% at 50% 0%, #000 10%, transparent 75%);
  mask-image:radial-gradient(ellipse 100% 70% at 50% 0%, #000 10%, transparent 75%);
}
.orb{
  position:fixed; z-index:-1; border-radius:50%;
  filter:blur(90px); opacity:var(--orb-opacity);
  pointer-events:none; will-change:transform;
}
.orb.a{width:46vw;height:46vw;top:-14vw;left:-10vw; background:radial-gradient(circle,var(--orb-1),transparent 68%); animation:drift-a 26s ease-in-out infinite}
.orb.b{width:38vw;height:38vw;top:12vh;right:-12vw; background:radial-gradient(circle,var(--orb-2),transparent 68%); animation:drift-b 32s ease-in-out infinite}
.orb.c{width:40vw;height:40vw;top:58vh;left:14vw;  background:radial-gradient(circle,var(--orb-3),transparent 68%); animation:drift-c 38s ease-in-out infinite}
@keyframes drift-a{50%{transform:translate3d(7vw,6vh,0) scale(1.14)}}
@keyframes drift-b{50%{transform:translate3d(-8vw,10vh,0) scale(.88)}}
@keyframes drift-c{50%{transform:translate3d(10vw,-8vh,0) scale(1.1)}}

/* ---------- layout ---------- */
.wrap{
  position:relative; max-width:1120px; margin:0 auto;
  padding:calc(var(--chrome-h) + clamp(2rem,5vw,4rem)) max(1rem,4vw) 4rem;
}

/* ---------- header ---------- */
header{margin-bottom:clamp(2.5rem,5vw,3.75rem)}
.chip{
  display:inline-flex; align-items:center; gap:.55rem;
  padding:.4rem .9rem .4rem .7rem; border-radius:999px;
  border:1px solid var(--line-strong); background:var(--glass);
  font-family:var(--mono); font-size:.68rem; letter-spacing:.2em;
  text-transform:uppercase; color:var(--fg-dim); margin-bottom:1.4rem;
}
.chip .dot{
  width:7px; height:7px; border-radius:50%;
  background:hsl(207 var(--card-s) var(--card-l));
  box-shadow:0 0 10px 2px hsl(207 var(--card-s) var(--card-l) / .7);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

/* Blue to gold, flat at both ends so the two colours are unmistakably the
   language's rather than a wash that happens to pass through them. */
h1{
  font-family:var(--serif); font-weight:700;
  font-size:clamp(2.4rem,7vw,4.2rem); line-height:1.04;
  letter-spacing:-.025em; margin:0 0 1rem;
  background:linear-gradient(100deg,
    hsl(207 var(--card-s) var(--card-l)) 0%,
    hsl(207 var(--card-s) var(--card-l)) 20%,
    hsl(48  var(--card-s) var(--card-l)) 88%,
    hsl(48  var(--card-s) var(--card-l)) 100%);
  background-size:250% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:sheen 12s linear infinite;
}
@keyframes sheen{to{background-position:250% 0}}

p.sub{color:var(--fg-dim); font-size:clamp(1rem,2vw,1.1rem); max-width:58ch; margin:0 0 1.9rem}

.stats{display:flex; flex-wrap:wrap; gap:.6rem}
.stat{
  display:flex; align-items:baseline; gap:.5rem;
  padding:.55rem 1rem; border-radius:10px;
  border:1px solid var(--line); background:var(--glass);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.stat b{font-family:var(--serif); font-size:1.15rem; font-weight:600; color:var(--fg)}
.stat span{font-family:var(--mono); font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; color:var(--fg-faint)}

/* ---------- section heading ---------- */
h2{
  display:flex; align-items:center; gap:1rem;
  font-family:var(--mono); font-weight:500; font-size:.76rem;
  letter-spacing:.24em; text-transform:uppercase; color:var(--fg-dim);
  margin:0 0 1.35rem;
}
h2::after{content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--line-strong),transparent)}
h2 .count{font-size:.7rem; color:var(--fg-faint); letter-spacing:.1em}

/* ---------- topic rows ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(430px,1fr)); gap:.9rem}

.topic{
  --spot-x:50%; --spot-y:0%;
  position:relative; display:grid;
  grid-template-columns:auto minmax(0,1fr); gap:.6rem 1rem;
  padding:1.15rem 1.25rem 1rem; border-radius:16px;
  border:1px solid var(--line); background:var(--glass);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  overflow:hidden; isolation:isolate;
  transition:border-color .25s ease, background .25s ease, box-shadow .25s ease;
}
.topic::before{
  content:''; position:absolute; inset:0; z-index:-1; opacity:0;
  transition:opacity .25s ease;
  background:radial-gradient(360px circle at var(--spot-x) var(--spot-y),
             hsl(var(--topic-h) 95% 62% / .16), transparent 62%);
}
.topic::after{
  content:''; position:absolute; top:0; left:12%; right:12%; height:1px;
  background:linear-gradient(90deg,transparent,hsl(var(--topic-h) var(--card-s) var(--card-l)),transparent);
  opacity:.35; transition:opacity .25s ease, left .35s ease, right .35s ease;
}
.topic:hover, .topic:focus-within{
  background:var(--glass-hover);
  border-color:hsl(var(--topic-h) 80% 60% / .42);
  box-shadow:0 18px 40px -20px hsl(var(--topic-h) 85% 45% / .5);
}
.topic:hover::before, .topic:focus-within::before{opacity:1}
.topic:hover::after, .topic:focus-within::after{opacity:1; left:0; right:0}

.glyph{
  width:40px; height:40px; display:grid; place-items:center;
  border-radius:11px; grid-row:span 2;
  border:1px solid hsl(var(--topic-h) 80% 58% / .30);
  background:hsl(var(--topic-h) 80% 58% / .11);
  color:hsl(var(--topic-h) var(--card-s) var(--card-l));
  transition:background .25s ease, box-shadow .25s ease;
}
.glyph svg{width:21px; height:21px; display:block}
.topic:hover .glyph{background:hsl(var(--topic-h) 80% 58% / .2); box-shadow:0 0 22px -6px hsl(var(--topic-h) 90% 55% / .6)}

.topic-title{
  font-family:var(--serif); font-weight:600; font-size:1.14rem;
  letter-spacing:-.01em; margin:0; align-self:center; color:var(--fg);
}
.topic-blurb{grid-column:2; font-size:.85rem; color:var(--fg-dim); line-height:1.5; margin:-.15rem 0 .1rem}

.acts{grid-column:2; display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.15rem}
.act{
  display:inline-flex; align-items:center; gap:.5rem;
  font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
  text-decoration:none; padding:.45rem .7rem; border-radius:8px;
  border:1px solid var(--line-strong); color:var(--fg-dim); background:transparent;
  transition:color .2s ease, border-color .2s ease, background .2s ease;
}
.act i{font-style:normal; transition:transform .2s ease}
.act:hover, .act:focus-visible{
  color:hsl(var(--topic-h) var(--card-s) var(--card-l));
  border-color:hsl(var(--topic-h) 80% 58% / .55);
  background:hsl(var(--topic-h) 80% 58% / .10);
  outline:none;
}
.act:hover i{transform:translateX(4px)}
.act:focus-visible{outline:2px solid hsl(var(--topic-h) var(--card-s) var(--card-l)); outline-offset:2px}
.act .tag{
  font-size:.58rem; letter-spacing:.12em; padding:.15rem .4rem;
  border:1px solid currentColor; border-radius:999px; opacity:.72;
}

/* ---------- continue where you left off ---------- */
.resume{
  position:relative; display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-rows:auto auto auto; align-items:center; gap:.5rem 1.15rem;
  padding:1.15rem 1.35rem; border-radius:16px; margin-bottom:1rem;
  border:1px solid hsl(var(--topic-h) 80% 58% / .34);
  background:
    linear-gradient(100deg, hsl(var(--topic-h) 85% 55% / .11), transparent 62%),
    var(--glass);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  overflow:hidden;
}
.resume .glyph{ grid-column:1; grid-row:1 / span 3; }
.resume-head{ grid-column:2; grid-row:1; display:flex; align-items:baseline; flex-wrap:wrap; gap:.55rem; min-width:0; }
.resume-title{
  font-family:var(--serif); font-weight:600; font-size:1.14rem;
  letter-spacing:-.01em; margin:0; color:var(--fg);
}
.resume-kind{
  font-family:var(--mono); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase;
  color:hsl(var(--topic-h) var(--card-s) var(--card-l));
  border:1px solid hsl(var(--topic-h) 80% 58% / .4); border-radius:999px; padding:.18rem .5rem;
}
.resume-where{
  grid-column:2; grid-row:2; min-width:0; margin:0;
  font-size:.85rem; color:var(--fg-dim); line-height:1.5;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.resume-where b{ color:var(--fg); font-weight:600; }
.resume-go{
  grid-column:3; grid-row:1 / span 3; align-self:center; justify-self:end;
  display:inline-flex; align-items:center; gap:.5rem;
  font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
  text-decoration:none; padding:.6rem .95rem; border-radius:9px; white-space:nowrap;
  color:hsl(var(--topic-h) var(--card-s) var(--card-l));
  border:1px solid hsl(var(--topic-h) 80% 58% / .5);
  background:hsl(var(--topic-h) 80% 58% / .12);
  transition:background .2s ease, border-color .2s ease;
}
.resume-go i{ font-style:normal; transition:transform .2s ease; }
.resume-go:hover{ background:hsl(var(--topic-h) 80% 58% / .22); border-color:hsl(var(--topic-h) 80% 58% / .8); }
.resume-go:hover i{ transform:translateX(4px); }
.resume-go:focus-visible{ outline:2px solid hsl(var(--topic-h) var(--card-s) var(--card-l)); outline-offset:2px; }

.resume-bar{
  grid-column:2; grid-row:3; height:3px; border-radius:999px; margin-top:.15rem;
  background:var(--line-strong); overflow:hidden;
}
.resume-bar i{
  display:block; height:100%; border-radius:999px;
  background:linear-gradient(90deg,
    hsl(var(--topic-h) var(--card-s) var(--card-l) / .55),
    hsl(var(--topic-h) var(--card-s) var(--card-l)));
}

@media (max-width:620px){
  .resume{ grid-template-columns:auto minmax(0,1fr); grid-template-rows:auto auto auto auto; }
  .resume .glyph{ grid-row:1 / span 3; }
  .resume-go{ grid-column:1 / -1; grid-row:4; justify-self:stretch; justify-content:center; margin-top:.65rem; }
}

/* ---------- per-action progress ---------- */
.act .pr{
  display:inline-flex; align-items:center; gap:.35rem;
  font-size:.62rem; letter-spacing:.06em; color:var(--fg-faint);
  max-width:11ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.act:hover .pr{ color:inherit; }
.act .ring{
  width:11px; height:11px; border-radius:50%; flex:0 0 auto;
  background:conic-gradient(currentColor calc(var(--p) * 1%), var(--line-strong) 0);
  -webkit-mask:radial-gradient(closest-side, transparent 56%, #000 58%);
  mask:radial-gradient(closest-side, transparent 56%, #000 58%);
}
@supports not ((mask:radial-gradient(closest-side, transparent 56%, #000 58%)) or (-webkit-mask:radial-gradient(closest-side, transparent 56%, #000 58%))){
  .act .ring{ width:9px; height:9px; }
}

/* ---------- tracks ----------
   The other hubs. Same card as the front door's, and the same reason for
   the gradient: a track is a subject, not a topic, and it does not borrow
   a topic hue. */
.track{
  position:relative; display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-rows:auto auto; align-items:center; gap:.25rem 1.05rem;
  padding:1.1rem 1.3rem; border-radius:16px;
  border:1px solid var(--line); background:var(--glass);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  overflow:hidden; isolation:isolate;
  transition:border-color .25s ease, background .25s ease, box-shadow .25s ease;
  --track-a:hsl(var(--track-h1) var(--card-s) var(--card-l));
  --track-b:hsl(var(--track-h2) var(--card-s) var(--card-l));
  /* The section headings carry no top margin -- they are ruled lines, not
     paragraphs -- so the gap to whatever follows belongs to the card. */
  margin-bottom:2rem;
}
.track[data-track="python"]{ --track-h1:207; --track-h2:48; }
.track[data-track="dsa"]   { --track-h1:168; --track-h2:265; }
.track::after{
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,var(--track-a),var(--track-b));
  opacity:.55; transition:opacity .25s ease;
}
.track:hover, .track:focus-within{
  background:var(--glass-hover);
  border-color:hsl(var(--track-h1) 80% 60% / .45);
  box-shadow:0 18px 44px -22px hsl(var(--track-h1) 85% 45% / .55);
}
.track:hover::after, .track:focus-within::after{opacity:1}
.track .glyph{
  grid-row:1 / span 2; width:44px; height:44px;
  border-color:hsl(var(--track-h1) 80% 58% / .32);
  background:linear-gradient(135deg,
    hsl(var(--track-h1) 80% 58% / .16), hsl(var(--track-h2) 80% 58% / .14));
  color:var(--track-a);
}
.track:hover .glyph{box-shadow:0 0 24px -6px hsl(var(--track-h1) 90% 55% / .6)}
.track-title{
  grid-column:2; grid-row:1; margin:0; align-self:end;
  font-family:var(--serif); font-weight:600; font-size:1.16rem;
  letter-spacing:-.01em; color:var(--fg);
}
.track-blurb{grid-column:2; grid-row:2; margin:0; align-self:start; font-size:.85rem; color:var(--fg-dim); line-height:1.5}
.track-go{
  grid-column:3; grid-row:1 / span 2; justify-self:end;
  display:inline-flex; align-items:center; gap:.5rem; white-space:nowrap;
  font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
  text-decoration:none; padding:.55rem .9rem; border-radius:9px;
  color:var(--track-a);
  border:1px solid hsl(var(--track-h1) 80% 58% / .45);
  background:hsl(var(--track-h1) 80% 58% / .10);
  transition:background .2s ease, border-color .2s ease;
}
.track-go i{font-style:normal; transition:transform .2s ease}
.track-go:hover{background:hsl(var(--track-h1) 80% 58% / .2); border-color:hsl(var(--track-h1) 80% 58% / .75)}
.track-go:hover i{transform:translateX(4px)}
.track-go:focus-visible{outline:2px solid var(--track-a); outline-offset:2px}
.track-n{font-family:var(--mono); font-size:.62rem; letter-spacing:.14em; color:var(--fg-faint); margin-left:.55rem}

@media (max-width:620px){
  .track{grid-template-columns:auto minmax(0,1fr); grid-template-rows:auto auto auto}
  .track-go{grid-column:1 / -1; grid-row:3; justify-self:stretch; justify-content:center; margin-top:.7rem}
}

/* ---------- entrance ---------- */
.reveal{opacity:0; transform:translateY(16px)}
.reveal.in{animation:rise .6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* ---------- footer ---------- */
footer{
  margin-top:clamp(3rem,7vw,4.5rem); padding-top:1.4rem;
  border-top:1px solid var(--line);
  font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; color:var(--fg-faint);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:.6rem;
}
footer .mark{
  background:linear-gradient(90deg,hsl(207 var(--card-s) var(--card-l)),hsl(48 var(--card-s) var(--card-l)));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

@media (max-width:520px){
  .grid{grid-template-columns:1fr}
  .topic{grid-template-columns:1fr}
  .glyph{grid-row:auto}
  .topic-blurb, .acts{grid-column:1}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  /* .orb.a is (0,2,0), so a bare .orb here loses to it however late it
     comes. The reset has to match the specificity that set the drift. */
  .orb.a, .orb.b, .orb.c, .chip .dot, h1{animation:none}
  .reveal, .reveal.in{opacity:1; transform:none; animation:none}
  .topic, .act, .act i, .glyph, .resume-go, .resume-go i,
  .track, .track-go, .track-go i{transition:none}
}

/* ---------- print ----------
   Deep space is a screen idea; on paper the backgrounds are not printed at
   all, so a dark hub comes out as a blank sheet. Print gets daylight and a
   plain index, which is all a printed hub could ever be. */
@media print{
  @page{margin:14mm}
  :root[data-topic="python"]{
    color-scheme:light;
    --bg:#FFFFFF; --bg-deep:#FFFFFF; --surface:#FFFFFF; --surface-2:#FFFFFF;
    --fg:#161A2C; --fg-dim:#4B5473; --fg-faint:#7B85A5;
    --line:rgba(38,56,120,.28); --line-strong:rgba(38,56,120,.45);
    --glass:transparent; --glass-hover:transparent;
    --sky-1:transparent; --sky-2:transparent; --sky-3:transparent;
    --grid-ink:transparent; --orb-opacity:0;
    --card-l:34%; --card-s:60%;
  }
  .sky,.orb{display:none!important}
  .grid{grid-template-columns:1fr!important}
  .reveal{opacity:1!important;transform:none!important;animation:none!important}
  .topic,.resume,.track{break-inside:avoid;page-break-inside:avoid}
}
</style>
<noscript><style>.reveal{opacity:1;transform:none}</style></noscript>
</head>
<body>
  <div class="sky"></div>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- A class, drawn the way a class diagram draws one: a name band,
           then the members, then the arrow that says something inherits
           from it. -->
      <g id="i-class" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="16" height="7" rx="1.4"/>
        <path d="M4 7.2h16"/>
        <path d="M12 10v4.2"/>
        <path d="m9.6 12.6 2.4-2.6 2.4 2.6"/>
        <rect x="4" y="14.4" width="16" height="6.6" rx="1.4"/>
        <path d="M7 17.6h5"/>
      </g>
      <!-- The DSA track: a tree, because that is what eight of its eleven
           topics are underneath. -->
      <g id="i-dsa" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="4.5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
        <circle cx="3.5" cy="19.5" r="1.7"/><circle cx="9" cy="19.5" r="1.7"/>
        <path d="M10.7 6.1 7.3 10.4M13.3 6.1l3.4 4.3M5.2 13.7l-.9 4.2M6.9 13.7l1.6 4.2"/>
      </g>
    </defs>
  </svg>

  <div class="wrap">
    <header>
      <div class="chip reveal"><span class="dot"></span>The object model, up close</div>
      <h1 class="reveal">Python</h1>
      <p class="sub reveal">The language explained by the rules underneath it, not by its syntax. Every claim is something you can run, break, and measure in the page.</p>
      <div class="stats reveal" id="stats"></div>
    </header>

    <section id="tracksWrap" hidden>
      <h2>Tracks</h2>
      <div id="tracks"></div>
    </section>

    <section id="resumeWrap" hidden>
      <h2>Continue</h2>
      <div id="resume"></div>
    </section>

    <section>
      <h2>Topics <span class="count" id="topicCount"></span></h2>
      <div class="grid" id="topics"></div>
    </section>

    <footer>
      <span class="mark">Atiq's Python</span>
      <span>Built to be read, run, and argued with</span>
    </footer>
  </div>

<script>
/* Everything on this page is drawn from shared/catalog.js, so adding a
   Python module means adding one entry there and nothing here.

   On DOMContentLoaded, not immediately: shared/catalog.js is deferred, so
   it has not run yet while this inline script is being parsed. Deferred
   scripts all finish before DOMContentLoaded fires, which makes this the
   earliest point where DSA_CATALOG is guaranteed to exist. */
document.addEventListener('DOMContentLoaded', function(){
  var cat = window.DSA_CATALOG;
  if (!cat) return;

  /* Which track this hub is comes from the attribute the chrome bar and
     the accent hue already read, rather than from a second copy of the
     string 'python' living down here. */
  var TRACK = cat.trackById(document.documentElement.getAttribute('data-topic'));
  if (!TRACK) return;
  var topics = cat.inTrack(TRACK.id);

  var esc = function(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  };

  /* ---------- where you got to ----------
     shared/chrome.js writes one `dsa.progress.<topic>.<deck|lab>` record
     per page as you move through it. Anything unparseable is dropped
     without comment: a hub that throws because of a stale localStorage
     entry is worse than one with no Continue card. */
  var PREFIX = 'dsa.progress.';

  function readProgress(){
    var out = {}, i, key, rest, dot, rec;
    try {
      for (i = 0; i < localStorage.length; i++) {
        key = localStorage.key(i);
        if (!key || key.indexOf(PREFIX) !== 0) continue;
        rest = key.slice(PREFIX.length);
        dot = rest.lastIndexOf('.');
        if (dot < 1) continue;
        var id = rest.slice(0, dot), kind = rest.slice(dot + 1);
        if (kind !== 'deck' && kind !== 'lab') continue;
        var t0 = cat.byId(id);
        if (!t0) continue;                           /* topic since removed */
        if (cat.trackIdOf(t0) !== TRACK.id) continue; /* another hub's business */
        try { rec = JSON.parse(localStorage.getItem(key)); } catch (e) { continue; }
        if (!rec || typeof rec.at !== 'number' || typeof rec.total !== 'number') continue;
        if (rec.total < 1 || rec.at < 1 || rec.at > rec.total) continue;
        rec.topicId = id;
        rec.pageKind = kind;
        out[id + '.' + kind] = rec;
      }
    } catch (e) {}
    return out;
  }

  var progress = readProgress();

  function pct(rec){ return Math.round(rec.at / rec.total * 100); }

  /* The chip that rides on a Deck or Lab action. Slides get a ring and a
     count; sections get the name of the one you were in, because "tab 7
     of 10" is not a measure of anything. */
  function chip(rec){
    if (!rec) return '';
    if (rec.unit === 'section') {
      return rec.label
        ? '<span class="pr" title="You were last in: ' + esc(rec.label) + '">' +
          esc(rec.label) + '</span>'
        : '';
    }
    return '<span class="pr"><span class="ring" style="--p:' + pct(rec) + '"></span>' +
           rec.at + '/' + rec.total + '</span>';
  }

  function renderResume(){
    /* The most recent record that is actually somewhere -- being parked on
       slide one is not progress worth advertising. */
    var best = null;
    Object.keys(progress).forEach(function(k){
      var r = progress[k];
      if (r.at < 2) return;
      if (!best || r.ts > best.ts) best = r;
    });
    if (!best) return;

    var t = cat.byId(best.topicId);
    var file = t && t[best.pageKind];
    if (!file) return;

    var where = best.unit === 'section'
      ? (best.label ? 'You were in <b>' + esc(best.label) + '</b>.'
                    : 'Pick up where you left off.')
      : 'Slide <b>' + best.at + '</b> of ' + best.total +
        (best.label ? ' — ' + esc(best.label) : '');

    var bar = best.unit === 'section' ? ''
      : '<div class="resume-bar"><i style="width:' + pct(best) + '%"></i></div>';

    var kindWord = best.pageKind === 'lab' ? 'Lab' : 'Deck';
    document.getElementById('resume').innerHTML =
      '<article class="resume" data-topic="' + best.topicId + '">' +
        '<span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#' + t.icon + '"/></svg></span>' +
        '<div class="resume-head">' +
          '<h3 class="resume-title">' + esc(t.title) + '</h3>' +
          '<span class="resume-kind">' + kindWord + '</span>' +
        '</div>' +
        '<p class="resume-where">' + where + '</p>' +
        bar +
        '<a class="resume-go" href="' + file + '#' + encodeURIComponent(best.hash || best.at) + '"' +
          ' aria-label="Resume the ' + esc(t.title) + ' ' + kindWord.toLowerCase() + '">' +
          'Resume <i>&#8594;</i></a>' +
      '</article>';
    document.getElementById('resumeWrap').hidden = false;
  }

  /* ---------- the other hubs ---------- */
  function renderTracks(){
    var others = cat.tracks.filter(function(tr){ return tr.id !== TRACK.id; });
    if (!others.length) return;
    document.getElementById('tracks').innerHTML = others.map(function(tr){
      var n = cat.modules(tr.id);
      return '<article class="track reveal" data-track="' + tr.id + '">' +
        '<span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#' + tr.icon + '"/></svg></span>' +
        '<h3 class="track-title">' + esc(tr.title) +
          '<span class="track-n">' + n + ' module' + (n === 1 ? '' : 's') + '</span></h3>' +
        '<p class="track-blurb">' + esc(tr.blurb) + '</p>' +
        '<a class="track-go" href="' + tr.hub + '" aria-label="Open the ' + esc(tr.title) + ' hub">' +
          'Open <i>&#8594;</i></a>' +
      '</article>';
    }).join('');
    document.getElementById('tracksWrap').hidden = false;
  }

  renderTracks();

  /* A count of zero is not a fact worth a tile: a track with no labs yet
     should say nothing about labs rather than lead with the nought. */
  var tiles = [[cat.modules(TRACK.id), 'Modules'],
               [cat.decks(TRACK.id), 'Decks'],
               [cat.labs(TRACK.id), 'Labs']]
    .filter(function(t){ return t[0] > 0; })
    .concat([['3.12+', 'Targets']]);

  document.getElementById('stats').innerHTML = tiles.map(function(t){
    return '<div class="stat"><b>' + t[0] + '</b><span>' + t[1] + '</span></div>';
  }).join('');

  document.getElementById('topicCount').textContent =
    String(topics.length).padStart(2, '0');

  document.getElementById('topics').innerHTML = topics.map(function(t){
    /* An action you have already started goes back to where you were, the
       way every "continue watching" list does. Home still gets you to the
       first slide in one keystroke once you are there. */
    var act = function(file, label, kind, extra){
      var rec = progress[t.id + '.' + kind];
      var href = file + (rec && rec.at > 1 ? '#' + encodeURIComponent(rec.hash || rec.at) : '');
      var title = rec && rec.at > 1
        ? (rec.unit === 'section' ? 'Resume in ' + rec.label
                                  : 'Resume at slide ' + rec.at + ' of ' + rec.total)
        : 'Start at the beginning';
      return '<a class="act" href="' + href + '" title="' + esc(title) + '">' +
             label + ' ' + chip(rec) + '<i>&#8594;</i>' + (extra || '') + '</a>';
    };

    var acts = '';
    if (t.deck) acts += act(t.deck, 'Deck', 'deck', '');
    if (t.lab) acts += act(t.lab, 'Lab', 'lab',
      t.desktop ? '<span class="tag" title="Fixed stage: needs a wider screen">desktop</span>' : '');
    return '<article class="topic reveal" data-topic="' + t.id + '">' +
      '<span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#' + t.icon + '"/></svg></span>' +
      '<h3 class="topic-title">' + esc(t.title) + '</h3>' +
      '<p class="topic-blurb">' + esc(t.blurb) + '</p>' +
      '<div class="acts">' + acts + '</div>' +
    '</article>';
  }).join('');

  renderResume();

  /* cursor-tracking spotlight */
  document.querySelectorAll('.topic').forEach(function(card){
    card.addEventListener('pointermove', function(e){
      var r = card.getBoundingClientRect();
      card.style.setProperty('--spot-x', (e.clientX - r.left) + 'px');
      card.style.setProperty('--spot-y', (e.clientY - r.top) + 'px');
    });
  });

  /* staggered entrance as sections scroll into view */
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = document.querySelectorAll('.reveal');
  if (reduced || !('IntersectionObserver' in window)) {
    items.forEach(function(el){ el.classList.add('in'); });
  } else {
    var io = new IntersectionObserver(function(entries, obs){
      entries.forEach(function(entry){
        if (!entry.isIntersecting) return;
        var group = [].indexOf.call(entry.target.parentElement.children, entry.target);
        entry.target.style.animationDelay = Math.min(group, 8) * 55 + 'ms';
        entry.target.classList.add('in');
        obs.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
    items.forEach(function(el){ io.observe(el); });
  }
});
</script>
</body>
</html>
